<!DOCTYPE html>
<html>
<head>
    <title>BookMyShow Movie Details</title>

    <style>

        body {
            background-color: white;
            color: black;
            font-family: Arial, sans-serif;
            padding: 30px;
            transition: 0.3s;
        }

        .movie-card {
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
            max-width: 500px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        /* Dark mode styles */

        body.dark-mode {
            background-color: #181818;
            color: white;
        }

        body.dark-mode .movie-card {
            background-color: #292929;
            border-color: white;
        }

    </style>

</head>
<body>

    <button onclick="toggleDarkMode()">
        Switch Light / Dark Mode
    </button>

    <div class="movie-card">

        <h1>Movie Details</h1>

        <h2>3 Idiots</h2>

        <p>
            3 Idiots is a popular Indian movie about friendship,
            education and following your dreams.
        </p>

        <p>Rating: 4.5/5</p>

        <p>Duration: 2h 50min</p>

    </div>

    <script>

        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }

    </script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <h1 class="text-center mb-5">
        Product Showcase
    </h1>

    <div class="row g-4">

        <!-- Product 1 -->
        <div class="col-md-3 col-6">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     height="200">

                <div class="card-body text-center">

                    <h5>Headphones</h5>

                    <p>₹1,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>


        <!-- Product 2 -->
        <div class="col-md-3 col-6">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1478737270239-2f02b77fc618?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     height="200">

                <div class="card-body text-center">

                    <h5>Microphone</h5>

                    <p>₹2,499</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>


        <!-- Product 3 -->
        <div class="col-md-3 col-6">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     height="200">

                <div class="card-body text-center">

                    <h5>Speaker</h5>

                    <p>₹3,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>


        <!-- Product 4 -->
        <div class="col-md-3 col-6">

            <div class="card">

                <img src="https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?auto=format&fit=crop&w=500&q=80"
                     class="card-img-top"
                     height="200">

                <div class="card-body text-center">

                    <h5>Keyboard</h5>

                    <p>₹5,999</p>

                    <button class="btn btn-primary">
                        Buy Now
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

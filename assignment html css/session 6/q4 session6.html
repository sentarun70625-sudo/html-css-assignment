```html
<!DOCTYPE html>
<html>
<head>
    <title>Movie Poster Grid</title>

    <style>
        .movie-grid {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .movie-poster {
            position: relative;
            width: 200px;
        }

        .movie-poster img {
            width: 200px;
            height: 280px;
            display: block;
        }

        .new-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 6px 10px;
            font-weight: bold;
        }
    </style>

</head>
<body>

    <h1>BookMyShow Movies</h1>

    <div class="movie-grid">

        <div class="movie-poster">

            <span class="new-badge">NEW</span>

            <img src="movie1.jpg" alt="New Movie">

        </div>

        <div class="movie-poster">

            <img src="movie2.jpg" alt="Movie 2">

        </div>

        <div class="movie-poster">

            <img src="movie3.jpg" alt="Movie 3">

        </div>

    </div>

</body>
</html>

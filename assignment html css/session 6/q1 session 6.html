```html
<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Card</title>

    <style>
        .restaurant-card {
            border: 2px solid #e23744;
            margin: 30px;
            padding: 20px;
            width: 300px;
        }

        .restaurant-name {
            border-bottom: 1px solid gray;
            padding: 10px;
        }

        .cuisine {
            border-bottom: 1px solid gray;
            padding: 10px;
        }

        .rating {
            padding: 10px;
        }
    </style>

</head>
<body>

    <div class="restaurant-card">

        <div class="restaurant-name">
            <h2>Spice Garden</h2>
        </div>

        <div class="cuisine">
            <p>Cuisine: Indian, Gujarati</p>
        </div>

        <div class="rating">
            <p>Rating: 4.5/5</p>
        </div>

    </div>

</body>
</html>

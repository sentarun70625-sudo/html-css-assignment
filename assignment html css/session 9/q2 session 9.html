<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zomato Restaurant Listing</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Zomato Restaurants</h1>

    <div class="row g-4">

        <!-- Restaurant 1 -->
        <div class="col-6">
            <div class="card p-3">
                <h3>Domino's Pizza</h3>
                <p>Delicious pizzas, garlic bread and refreshing drinks.</p>
            </div>
        </div>

        <!-- Restaurant 2 -->
        <div class="col-6">
            <div class="card p-3">
                <h3>McDonald's</h3>
                <p>Popular burgers, fries and tasty fast food.</p>
            </div>
        </div>

        <!-- Restaurant 3 -->
        <div class="col-6">
            <div class="card p-3">
                <h3>Honest Restaurant</h3>
                <p>Enjoy delicious Indian food and Gujarati dishes.</p>
            </div>
        </div>

        <!-- Restaurant 4 -->
        <div class="col-6">
            <div class="card p-3">
                <h3>La Pino's Pizza</h3>
                <p>Fresh and cheesy pizzas with different toppings.</p>
            </div>
        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Movie Details</h1>

    <div class="row align-items-center">

        <!-- Movie Poster -->
        <div class="col-md-5">
            <img src="https://via.placeholder.com/400x550"
                 class="img-fluid"
                 alt="Movie Poster">
        </div>

        <!-- Movie Details -->
        <div class="col-md-7">

            <h1>Avengers: Endgame</h1>

            <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

            <p><strong>Rating:</strong> ⭐ 4.8/5</p>

            <p>
                The Avengers come together for their final battle
                to save the world and defeat their enemy.
            </p>

            <button class="btn btn-danger">
                Book Now
            </button>

        </div>

    </div>

</div>

</body>
</html>

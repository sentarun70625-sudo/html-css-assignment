<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">Flipkart Products</h1>

    <div class="row">

        <!-- Product 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/300" class="card-img-top" alt="Laptop">

                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p class="card-text">Powerful laptop for work and study.</p>
                    <h5>₹45,000</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Product 2 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/300" class="card-img-top" alt="Mobile">

                <div class="card-body">
                    <h5 class="card-title">Smartphone</h5>
                    <p class="card-text">Latest smartphone with great camera.</p>
                    <h5>₹20,000</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

        <!-- Product 3 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://via.placeholder.com/300" class="card-img-top" alt="Headphones">

                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p class="card-text">Wireless headphones with clear sound.</p>
                    <h5>₹1,499</h5>
                    <button class="btn btn-primary">Buy Now</button>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>

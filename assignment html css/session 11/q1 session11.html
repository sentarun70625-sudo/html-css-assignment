<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Spacing</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">

    <h1 class="text-center mt-4">
        Product Spacing
    </h1>

    <!-- Level 1 -->
    <div class="m-1 p-1">
        <div class="card">
            <img src="https://via.placeholder.com/300"
                 class="card-img-top"
                 alt="Product">

            <div class="card-body">
                <h5 class="card-title">Wireless Headphones</h5>
            </div>
        </div>
    </div>

    <!-- Level 2 -->
    <div class="m-3 p-3">
        <div class="card">
            <img src="https://via.placeholder.com/300"
                 class="card-img-top"
                 alt="Product">

            <div class="card-body">
                <h5 class="card-title">Smartphone</h5>
            </div>
        </div>
    </div>

    <!-- Level 3 -->
    <div class="m-5 p-5">
        <div class="card">
            <img src="https://via.placeholder.com/300"
                 class="card-img-top"
                 alt="Product">

            <div class="card-body">
                <h5 class="card-title">Laptop</h5>
            </div>
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restaurant List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Restaurants
    </h1>

    <div class="row g-4">

        <!-- Restaurant 1 -->
        <div class="col-md-4">

            <div class="card p-3">

                <h3>Domino's Pizza</h3>

                <p class="text-success fw-bold">
                    ⭐ 4.5 Rating
                </p>

                <span class="bg-warning p-2">
                    20% OFF
                </span>

                <p class="text-success mt-3 fw-bold">
                    Open Now
                </p>

            </div>

        </div>

        <!-- Restaurant 2 -->
        <div class="col-md-4">

            <div class="card p-3">

                <h3>McDonald's</h3>

                <p class="text-success fw-bold">
                    ⭐ 4.3 Rating
                </p>

                <span class="bg-warning p-2">
                    30% OFF
                </span>

                <p class="text-danger mt-3 fw-bold">
                    Closed
                </p>

            </div>

        </div>

        <!-- Restaurant 3 -->
        <div class="col-md-4">

            <div class="card p-3">

                <h3>Honest Restaurant</h3>

                <p class="text-success fw-bold">
                    ⭐ 4.6 Rating
                </p>

                <span class="bg-warning p-2">
                    15% OFF
                </span>

                <p class="text-success mt-3 fw-bold">
                    Open Now
                </p>

            </div>

        </div>

    </div>

</div>

</body>
</html>

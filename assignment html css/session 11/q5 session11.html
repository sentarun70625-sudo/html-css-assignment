<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div id="mainContainer"
     class="container-fluid bg-light text-dark min-vh-100 p-5">

    <h1>My Movie Page</h1>

    <p>
        Welcome to my movie booking page.
    </p>

    <button id="themeButton"
            class="btn btn-primary">
        Dark Mode
    </button>

</div>


<script>

    const mainContainer = document.getElementById("mainContainer");
    const themeButton = document.getElementById("themeButton");

    themeButton.addEventListener("click", function() {

        mainContainer.classList.toggle("bg-light");
        mainContainer.classList.toggle("bg-dark");

        mainContainer.classList.toggle("text-dark");
        mainContainer.classList.toggle("text-light");

        if (mainContainer.classList.contains("bg-dark")) {
            themeButton.innerText = "Light Mode";
        } else {
            themeButton.innerText = "Dark Mode";
        }

    });

</script>

</body>
</html>

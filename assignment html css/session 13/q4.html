<!DOCTYPE html>
<html>
<head>
    <title>Social Link Preview</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .form-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #cards {
            max-width: 800px;
            margin: 30px auto;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            width: 210px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 4px solid;
        }

        .instagram {
            border-color: #e1306c;
        }

        .linkedin {
            border-color: #0077b5;
        }

        .youtube {
            border-color: red;
        }

        .card img {
            width: 45px;
            height: 45px;
        }

        .visit {
            display: inline-block;
            padding: 9px 18px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>
</head>

<body>

    <div class="form-box">

        <h2>Social Links</h2>

        <form id="socialForm">

            <input
                type="url"
                id="instagram"
                placeholder="Instagram URL"
            >

            <input
                type="url"
                id="linkedin"
                placeholder="LinkedIn URL"
            >

            <input
                type="url"
                id="youtube"
                placeholder="YouTube URL"
            >

            <button type="submit">
                Submit
            </button>

        </form>

    </div>


    <div id="cards"></div>


    <script>

        document
            .getElementById("socialForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                let cards =
                    document.getElementById("cards");

                cards.innerHTML = "";


                let instagram =
                    document.getElementById("instagram").value;

                let linkedin =
                    document.getElementById("linkedin").value;

                let youtube =
                    document.getElementById("youtube").value;


                if (instagram != "") {

                    createCard(
                        "Instagram",
                        instagram,
                        "https://cdn-icons-png.flaticon.com/512/2111/2111463.png",
                        "instagram"
                    );

                }


                if (linkedin != "") {

                    createCard(
                        "LinkedIn",
                        linkedin,
                        "https://cdn-icons-png.flaticon.com/512/3536/3536505.png",
                        "linkedin"
                    );

                }


                if (youtube != "") {

                    createCard(
                        "YouTube",
                        youtube,
                        "https://cdn-icons-png.flaticon.com/512/1384/1384060.png",
                        "youtube"
                    );

                }

            });


        function createCard(
            platform,
            url,
            image,
            className
        ) {

            let username = extractUsername(url);

            let card =
                document.createElement("div");

            card.className =
                "card " + className;


            card.innerHTML = `

                <img src="${image}">

                <h3>${platform}</h3>

                <p>
                    @${username}
                </p>

                <a
                    class="visit"
                    href="${url}"
                    target="_blank"
                >
                    Visit
                </a>

            `;


            document
                .getElementById("cards")
                .appendChild(card);

        }


        function extractUsername(url) {

            try {

                let link =
                    new URL(url);

                let path =
                    link.pathname;

                path =
                    path.replace(/^\/|\/$/g, "");

                let parts =
                    path.split("/");

                return parts[parts.length - 1];

            }

            catch(error) {

                return "user";

            }

        }

    </script>

</body>
</html>

```html
<!DOCTYPE html>
<html>
<head>
    <title>Social Links</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .form-box {
            width: 90%;
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .input-box {
            position: relative;
            margin-bottom: 20px;
        }

        .input-box img {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 25px;
            height: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 14px 15px 14px 50px;
            box-sizing: border-box;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
        }

    </style>
</head>

<body>

    <div class="form-box">

        <h2>Add Social Links</h2>


        <!-- Instagram -->

        <div class="input-box">

            <img
                src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"
                alt="Instagram"
            >

            <input
                type="url"
                placeholder="Instagram Profile URL"
            >

        </div>


        <!-- LinkedIn -->

        <div class="input-box">

            <img
                src="https://cdn-icons-png.flaticon.com/512/3536/3536505.png"
                alt="LinkedIn"
            >

            <input
                type="url"
                placeholder="LinkedIn Profile URL"
            >

        </div>


        <!-- YouTube -->

        <div class="input-box">

            <img
                src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"
                alt="YouTube"
            >

            <input
                type="url"
                placeholder="YouTube Profile URL"
            >

        </div>


        <button>
            Add Social Links
        </button>

    </div>

</body>
</html>
```

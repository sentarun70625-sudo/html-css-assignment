<!DOCTYPE html>
<html>
<head>
    <title>Responsive Product Grid</title>

    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .product-card {
            border: 1px solid gray;
            padding: 20px;
            text-align: center;
        }

        .product-card img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            max-width: 100%;
        }

        .product-card h3 {
            margin-top: 10px;
        }

        /* Tablet - 2 columns */
        @media (max-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Mobile - 1 column */
        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>
<body>

    <h1>Responsive Product Grid</h1>

    <section class="product-grid">

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 1">
            <h3>Wireless Headphones</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 2">
            <h3>Smart Watch</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 3">
            <h3>Bluetooth Speaker</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 4">
            <h3>Gaming Mouse</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 5">
            <h3>Keyboard</h3>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/150"
                 alt="Product 6">
            <h3>Power Bank</h3>
        </div>

    </section>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Social App Icons</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .app-icon {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 15px;
        }
    </style>

</head>
<body>

    <h1>My Favorite Apps</h1>

    <div class="container">

        <img src="instagram.jpg"
             alt="Instagram"
             class="app-icon">

        <img src="whatsapp.jpg"
             alt="WhatsApp"
             class="app-icon">

        <img src="zomato.jpg"
             alt="Zomato"
             class="app-icon">

        <img src="spotify.jpg"
             alt="Spotify"
             class="app-icon">

    </div>

</body>
</html>
